name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Pure-Python behavior logic (scan_utils, stuck_detector) has no ROS or
  # simulator dependency by design, so it's tested directly with pytest --
  # fast, no container, no flakiness from Gazebo/GPU rendering in CI.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest src/bot_script/test/ -v

  # Full workspace build under the actual target ROS distro, catching
  # xacro/package.xml/CMakeLists regressions that unit tests can't see.
  colcon-build:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: rosdep install
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src -y --ignore-src || true
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
